# Electron reuses the browser composition without its network and browser-launch rows.

- id: web-startup
  disabled: true

- id: webserver
  disabled: true

- id: web-runtime
  disabled: true

- id: client-hmr
  disabled: true

- id: open-in-app
  disabled: true

- id: ui-open-in-app
  disabled: true

- id: directory-picker
  disabled: true

- id: connection
  inject:
    - credentials
  config: {}

- insert:
    - id: directory-picker-native
      name: '@deepseek-ai/dsh-host-directory-picker-native'

    - id: ui-directory-picker-native
      name: '@deepseek-ai/dsh-client-ui-directory-picker-native'

    # Desktop's own appearance: an alias-token layer over the built-in
    # palettes. Private, so it rides the runtime closure rather than a
    # registry install; the host package declares it as a dependency.
    - id: ui-theme-nord
      name: '@deepseek-ai/dsh-client-ui-theme-nord'
